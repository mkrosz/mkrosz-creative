<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Ícone da aba: um buraco negro (sem arquivo extra) -->
  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
  <title>Painel do Portfólio</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pf-theme');
        document.documentElement.dataset.theme = t || 'dark'; // mesmo padrão do portfólio
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <!-- LOGIN -->
  <main class="auth auth--space" id="view-login" hidden>
    <!-- o mesmo buraco negro do hero do portfólio, atrás do login -->
    <canvas class="auth__space" aria-hidden="true"></canvas>
    <!-- tema claro/escuro do login: canto inferior direito -->
    <button class="theme-fab" type="button" id="login-theme" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.6 6.6 0 0 0 11 11z"/></svg>
    </button>
    <div class="auth__card">
      <!-- marca: só o gato do mkrosz -->
      <!-- escuro: gato com brilho de buraco negro; claro: gato branco do buraco branco -->
      <div class="auth__logo" role="img" aria-label="mkrosz">
        <svg class="is-dark" viewBox="0 0 1410 940" aria-hidden="true" focusable="false"><use href="#mk-cat-glow"/></svg>
        <svg class="is-light" viewBox="0 0 1410 940" aria-hidden="true" focusable="false"><use href="#mk-cat-white-glow"/></svg>
      </div>
      <!-- Entrar -->
      <form class="auth__form" id="login-form" novalidate>
        <h1>Entrar</h1>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="email" autocomplete="username" required></label>
        <label class="field"><span>Senha</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit">Entrar</button>
        <button class="auth__link" type="button" data-auth="forgot">Esqueci minha senha</button>
      </form>
      <!-- Esqueci a senha: manda um link por e-mail -->
      <form class="auth__form" id="forgot-form" novalidate hidden>
        <h1>Esqueci a senha</h1>
        <p class="muted">Enviaremos um link para você criar uma senha nova.</p>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="email" autocomplete="username" required></label>
        <p class="form-ok" role="status" hidden></p>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit">Enviar link</button>
        <button class="auth__link" type="button" data-auth="login">Voltar para o login</button>
      </form>
      <!-- Chegou pelo link do e-mail: define a senha nova -->
      <form class="auth__form" id="recovery-form" novalidate hidden>
        <h1>Nova senha</h1>
        <label class="field"><span>Nova senha</span><input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label class="field"><span>Repita a nova senha</span><input class="input" type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit">Salvar nova senha</button>
      </form>
    </div>
  </main>

  <!-- AVISOS (não configurado / sem permissão) -->
  <main class="auth" id="view-notice" hidden>
    <div class="auth__card" id="notice-body"></div>
  </main>

  <!-- APP -->
  <div class="app" id="view-app" hidden>
    <aside class="side">
      <div class="side__top">
        <button class="side__brand" type="button" id="open-profile" aria-label="Meu perfil: e-mail e senha">
          <svg class="mark" viewBox="0 0 1110 740" aria-hidden="true" focusable="false"><use href="#mk-cat"/></svg>
          <span class="side__who"><strong data-bind="site_name">Portfólio</strong><span>Meu perfil</span></span>
        </button>
        <button class="side__out" type="button" id="logout" aria-label="Sair" title="Sair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
      <nav class="side__nav" id="side-nav" aria-label="Seções do painel"></nav>
      <div class="side__foot">
        <a class="side__site" href="../" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg><span>Ver site</span>
        </a>
        <button class="side__btn" type="button" id="theme-toggle" aria-label="Alternar tema">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.6 6.6 0 0 0 11 11z"/></svg>
          <span>Alternar tema</span>
        </button>
      </div>
    </aside>
    <div class="main">
      <div class="banner" id="demo-banner" hidden>
        <span class="banner__dot" aria-hidden="true"></span>Modo demonstração — as alterações ficam só nesta aba.
        <span class="tip" tabindex="0" role="img" aria-label="Configure o Supabase em shared/config.js para salvar de verdade." data-tip="Configure o Supabase em shared/config.js para salvar de verdade."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg></span>
      </div>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="section-group"></p>
          <h1 class="topbar__title" id="section-title"></h1>
        </div>
        <div class="topbar__actions" id="section-actions"></div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </div>
  </div>

  <!-- DRAWER (edição de itens) -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close></div>
    <form class="drawer__panel" id="drawer-form" novalidate>
      <header class="drawer__head">
        <div class="drawer__heading"><h2 id="drawer-title"></h2><span class="badge" id="drawer-status" hidden></span></div>
        <button class="icon-btn" type="button" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="drawer__body" id="drawer-body"></div>
      <footer class="drawer__foot">
        <span class="spacer"></span>
        <button class="btn btn--ghost" type="button" data-close>Cancelar</button>
        <button class="btn btn--ghost" type="submit" id="drawer-alt" hidden></button>
        <button class="btn btn--primary" type="submit" id="drawer-save">Salvar</button>
      </footer>
    </form>
  </div>

  <!-- CONFIRMAÇÃO -->
  <dialog class="confirm" id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-text"></p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" value="cancel">Cancelar</button>
        <button class="btn btn--danger" value="ok" id="confirm-ok">Excluir</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
