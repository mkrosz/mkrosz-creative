<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Página não encontrada — 404</title>
  <!-- Um 404 só para o site e o painel: as hospedagens estáticas (Vercel, Netlify,
       GitHub Pages, Cloudflare Pages) mostram /404.html em qualquer endereço que não
       existe, inclusive em /admin/... Os caminhos começam na raiz por isso. -->
  <link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
  <!-- o fundo é sempre escuro; o tema do site só decide entre buraco negro e branco -->
  <script>try { var t = localStorage.getItem('pf-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}</script>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/notfound.css">
</head>
<body>
  <canvas class="space" aria-hidden="true"></canvas>
  <main class="nf">
    <h1 class="nf__code" aria-label="404"><span class="d">4</span><span class="nf__cat"><svg class="is-dark" viewBox="0 0 1410 940" aria-hidden="true" focusable="false"><use href="#mk-cat-glow"/></svg><svg class="is-light" viewBox="0 0 1410 940" aria-hidden="true" focusable="false"><use href="#mk-cat-white-glow"/></svg></span><span class="d">4</span></h1>
    <p class="nf__title">Essa página caiu num buraco negro.</p>
    <p class="nf__text">O endereço pode ter mudado ou nunca ter existido. Mas o resto continua aqui, em órbita.</p>
    <!-- em /admin/... o notfound.js troca estes botões pelos do painel -->
    <div class="nf__actions">
      <a class="btn btn--primary" href="/">Voltar ao portfólio</a>
      <a class="btn btn--ghost" href="/#projetos">Ver projetos</a>
    </div>
  </main>
  <!-- tema: escuro = buraco negro, claro = buraco branco (mesmo botão do login do painel) -->
  <button class="theme-fab" type="button" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.6 6.6 0 0 0 11 11z"/></svg>
  </button>
  <script type="module" src="/shared/notfound.js"></script>
</body>
</html>
